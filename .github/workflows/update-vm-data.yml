name: Refresh Azure VM Data

on:
  schedule:
    - cron: '17 5 * * *' # Daily at 05:17 UTC - off the hour to avoid GitHub's top-of-hour scheduling load/drops
  workflow_dispatch:

concurrency:
  group: refresh-azure-vm-data
  cancel-in-progress: false

permissions:
  id-token: write # required to obtain the OIDC token for azure/login
  contents: write # required to push the updated data files
  actions: write # required to dispatch the deploy workflow below

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    name: Refresh VM SKU and pricing data
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Generate VM SKU/pricing data
        shell: pwsh
        run: ./scripts/GenerateVMResourceJson.ps1

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/azure.json web/lastupdate.json
          if git diff --cached --quiet; then
            echo "No changes to VM data - nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated refresh of Azure VM SKU/pricing data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Static Web Apps deploy
        # A push made with GITHUB_TOKEN doesn't fire the deploy workflow's own `push` trigger
        # (GitHub blocks GITHUB_TOKEN-authored pushes from triggering other workflows), so
        # dispatch it directly - workflow_dispatch is exempt from that restriction.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run azure-static-web-apps-happy-tree-030096503.yml --ref main
